<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jacob Andersen</title>
  <style>
    body {
      font-family: 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    h2 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #1a1a1a;
      margin-bottom: 4px;
    }
    img {
      width: 200px; /* smaller size */
      height: 280px; /* fixed height for cropping */
      object-fit: cover; /* crop instead of shrink */
      object-position: center top; /* crop bottom area (~5%) */
      border-radius: 15px;
      display: block;
      margin: 0 auto 30px auto;
    }
    .title {
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.2px;
      color: #666; /* lighter text */
      margin-top: 0; /* tighten spacing with name */
    }
    a {
      display: block;
      margin: 10px 0;
      font-size: 18px;
      color: #0366d6;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .profile-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0 30px 0;
    }
    .profile-link:hover {
      text-decoration: none;
    }
    .profile-link img {
      width: 30px;
      height: 30px;
      border-radius: 0;
      margin: 0;
      object-fit: contain;
      opacity: 0.65;
      transition: opacity 0.2s, transform 0.2s;
    }
    .profile-link:hover img {
      opacity: 1;
      transform: scale(1.3);
    }
    .teaching-link {
      display: inline-block;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.2px;
      color: #211a52;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }
    .page-links {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>Jacob Andersen</h2>
  <h3 class="title">Assistant Professor @ Aalborg University</h3>

  <div class="profile-links">
    <a class="profile-link" href="https://vbn.aau.dk/en/persons/jacoba" target="_blank" title="AAU Profile">
      <img src="icons/App-ikoner/AAU_AAUBLAA.png" alt="AAU">
    </a>

    <a class="profile-link" href="https://www.researchgate.net/profile/Jacob-Andersen-7?ev=hdr_xprf" target="_blank" title="ResearchGate Profile">
      <img src="icons/researchgate.svg" alt="ResearchGate">
    </a>

    <a class="profile-link" href="https://orcid.org/0000-0001-5067-9339" target="_blank" title="ORCID Profile">
      <img src="icons/orcid.webp" alt="ORCID">
    </a>

    <a class="profile-link" href="https://www.linkedin.com/in/jacob-andersen-44b19929b/" target="_blank" title="LinkedIn Profile">
      <img src="icons/linkedin.svg" alt="LinkedIn">
    </a>
  </div>

  <img src="photo_JA.png" alt="Photo">

  <div class="page-links">
    <a class="teaching-link" href="slides">Teaching</a>
    <a class="teaching-link" href="cv.html">CV</a>
  </div>
</body>
</html>
